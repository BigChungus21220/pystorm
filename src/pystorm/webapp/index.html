<!DOCTYPE html>
<html>
<head>
	<meta charset='utf-8'>
	<meta http-equiv='X-UA-Compatible' content='IE=edge'>
	<title>Pystorm Preview</title>
	<link rel="icon" href="/favicon.ico" type="image/x-icon">
	<meta name='viewport' content='width=device-width, initial-scale=1'>
	<script src='three.min.js'></script>
	<script src='OrbitControls.js'></script>
	<script src='molang.umd.js'></script>
	<script src='tinycolor-min.js'></script>
	<script src='wintersky.umd.js'></script>
	<script src='readers-writer-lock.js'></script>
	<script src='main.js'></script>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="main-container">
		<div class="preview-area">
			<canvas id="preview" class="preview"></canvas>
			<div class="info-bar">
				<div class="left-info-item info-item" id="info_identifier">identifier</div>
				<div class="center-info-item info-item" id="info_count"></div>
				<div class="right-info-item info-item" id="info_timer"></div>
			</div>
		</div>
		<div class="gallery-container" id="gallery_container">
			<button class="gallery-button" onclick="toggleGallery()">
				<img class="white-icon" src="particle_library.svg" alt="gallery"></img>
			</button>
			<div class="gallery">
				<h2>Library</h2>
				<div class="gallery-scroll">
					<div class="gallery-grid" id="gallery_grid">
						<div class="gallery-item">
							<img src="_placeholder.png" class="thumbnail"></img>
							<div class="item-title-box">
								<div class="item-title">placeholder</div>
							</div>
							<div class="item-source-box">
								<div class="item-source"></div>
							</div>
						</div>
					</div>
				</div>
				<div class="bottom-panel">
					<button class="kill-button btn-red" onclick="killServer()">Close Server</button>
				</div>
			</div>
		</div>
	</div>
	<script>
		initializeApp()
	</script>
</body>
</html>
