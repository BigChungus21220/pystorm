[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pystorm"
version = "0.1.0"
description = "A library for generating Minecraft: Bedrock Edition particles"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "BigChungus21220" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [

]

[project.optional-dependencies]
dev = [

]

[tool.black]
line-length = 88